# docker-compose.yml — Entorno de desarrollo local
# Levanta db y redis por defecto; api requiere --profile app (disponible en tarea 0.3)
# Uso: ./scripts/dev-up.sh | ./scripts/dev-down.sh

name: devnull

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── API (FastAPI) — solo arranca con --profile app ────────────────────────
  # TODO 0.3: añadir comando de arranque cuando exista el código de la app
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app
    # TODO 0.3: command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

# ── Volúmenes nombrados ───────────────────────────────────────────────────────
# Compose antepone el nombre del proyecto (devnull_) → devnull_pg_data, devnull_redis_data
volumes:
  pg_data:
  redis_data:

# ── Red interna ───────────────────────────────────────────────────────────────
# Nombre real: devnull_net
networks:
  net:
    driver: bridge
