# docker-compose.yml — Entorno de desarrollo local
# Levanta db y redis por defecto; api y worker requieren --profile app
# Uso: ./scripts/dev-up.sh | ./scripts/dev-down.sh

name: devnull

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── API pública (FastAPI) — solo arranca con --profile app ────────────────
  # Contenido del blog y métricas. Aplica las migraciones al arrancar.
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    profiles:
      - app

  # ── API de administración (FastAPI) — misma imagen, otro comando ───────────
  # Login y CMS del panel. Accesible desde cualquier red a través del proxy inverso;
  # la protección es la autenticación. Espera a que la API pública haya migrado la BD.
  admin-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8001}:8001"
    networks:
      - net
    depends_on:
      api:
        condition: service_healthy
    command: ["uvicorn", "app.apps.admin:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers"]
    profiles:
      - app

  # ── Worker (APScheduler) — publicaciones programadas y métricas ───────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    networks:
      - net
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - app
    command: ["python", "-m", "app.worker"]

# ── Volúmenes nombrados ───────────────────────────────────────────────────────
# Compose antepone el nombre del proyecto (devnull_) → devnull_pg_data, devnull_redis_data, devnull_media_data
volumes:
  pg_data:
  redis_data:
  media_data:

# ── Red interna ───────────────────────────────────────────────────────────────
# Nombre real: devnull_net
networks:
  net:
    driver: bridge
