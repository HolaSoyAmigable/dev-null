# CI — lint, tipos y tests en cada PR (tarea 0.5) + contrato OpenAPI y E2E (tarea 6.4).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores solo para CI: no son secretos reales.
  ENV: test
  POSTGRES_USER: devnull
  POSTGRES_PASSWORD: devnull-ci
  POSTGRES_DB: devnull
  DATABASE_URL: postgresql+asyncpg://devnull:devnull-ci@127.0.0.1:5432/devnull
  REDIS_URL: redis://127.0.0.1:6379/0
  JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
  REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345
  METRICS_SALT_SECRET: ci-metrics-salt
  REVALIDATE_SECRET: ci-revalidate-secret
  WEB_URL: http://localhost:3000
  SITE_URL: http://localhost:3000
  API_URL: http://127.0.0.1:8000

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devnull
          POSTGRES_PASSWORD: devnull-ci
          POSTGRES_DB: devnull
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devnull" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # Cobertura mínima del 80 % (docs/06-conventions.md).
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm --filter admin --filter web test
      - run: pnpm --filter admin build
      - run: pnpm --filter web build

  contract:
    name: Contrato OpenAPI ↔ tipos TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: bash scripts/generate-types.sh
      - name: Los tipos generados deben estar versionados y al día
        run: git diff --exit-code -- backend/openapi.admin.json backend/openapi.public.json admin/src/api/schema.d.ts web/src/lib/api/schema.d.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devnull
          POSTGRES_PASSWORD: devnull-ci
          POSTGRES_DB: devnull
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devnull" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
